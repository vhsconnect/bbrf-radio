services:
  bbrf-radio:
    image: bbrf-radio:latest
    build: .
    container_name: bbrf-radio
    restart: unless-stopped
    ports:
      - '4881:4881'
    volumes:
      - bbrf-data:/app/data
    environment:
      - XDG_CONFIG_HOME=/app/data

  bbrf:
    image: bbrf:latest
    build:
      context: .
      dockerfile: server-next/Dockerfile
    container_name: bbrf
    restart: unless-stopped
    # from .env; keeps the database owned by this user
    user: "${HOST_UID:-1000}:${HOST_GID:-100}"
    # a hub's distribution listens on its LAN address and the ingest node dials it,
    # so the node shares the host's network; the API listens on PORT directly
    network_mode: host
    volumes:
      # SQLite database, in the host state dir
      - ${STATE_DIR:-${HOME}/.local/state/bbrf}:/data
      # read-only view of the node server's favorites, imported once into the empty database
      - bbrf-data:/import:ro
      # hub and ingest only: make secrets output, and this node's age key from make age-key
      # (make docker creates both directories, so an all node mounts them empty)
      - ${SECRETS_DIR:-./secrets}:/secrets:ro
      - ${AGE_KEY_DIR:-${HOME}/.config/bbrf}:/age:ro
    tmpfs:
      # the decrypted TLS key and cookie, never written to disk
      - /run/bbrf:uid=${HOST_UID:-1000},gid=${HOST_GID:-100},mode=0700
    environment:
      - PORT=${PORT:-4882}
      - FAVORITES_IMPORT_FILE=/import/bbrf-radio/storage.json
      # each component on (1) or off (0)
      - BBRF_API=${BBRF_API:-1}
      - BBRF_INGESTER=${BBRF_INGESTER:-1}
      # hub, ingest or all; see server-next/DEPLOYMENT.md
      - BBRF_ROLE=${BBRF_ROLE:-all}
      - SYNC_HUB_NODE=${SYNC_HUB_NODE:-}
      - SYNC_INGEST_NODE=${SYNC_INGEST_NODE:-}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-}

volumes:
  bbrf-data:
    driver: local
